<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HAPICS Games</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <header class="hero">
      <p class="eyebrow">HAPICS</p>
      <h1>Games</h1>
      <p class="subtitle">Pick a game and play</p>
    </header>

    <section class="games-grid" aria-label="Available games">
      <!-- To add a new game, copy a game-card block and update:
           1. href       - path to the game (e.g. "/newgame/")
           2. span.emoji - icon for the game
           3. h2         - game name
           4. p          - short description
           5. Remove the "coming-soon" class if the game is live -->

      <a href="/snake/" class="game-card">
        <span class="game-icon" aria-hidden="true">&#x1F40D;</span>
        <h2 class="game-title">Snake</h2>
        <p class="game-desc">Classic and advanced modes with leaderboards</p>
        <span class="play-tag">Play <span class="arrow">&rarr;</span></span>
      </a>

      <a href="/tetris/" class="game-card">
        <span class="game-icon" aria-hidden="true">&#x1F9F1;</span>
        <h2 class="game-title">Tetris</h2>
        <p class="game-desc">Stack blocks, clear lines, chase high scores</p>
        <span class="play-tag">Play <span class="arrow">&rarr;</span></span>
      </a>

      <a href="/sudoku/" class="game-card">
        <span class="game-icon" aria-hidden="true">&#x1F522;</span>
        <h2 class="game-title">Sudoku</h2>
        <p class="game-desc">Three difficulty levels with pencil marks</p>
        <span class="play-tag">Play <span class="arrow">&rarr;</span></span>
      </a>
    </section>

    <footer class="footer">
      <p>&copy; HAPICS 2026</p>
    </footer>
  </main>
</body>
</html>
